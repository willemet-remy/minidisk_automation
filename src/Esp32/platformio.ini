; Slimme Minidisk — PlatformIO environments
;
;   Receiver (USB dongle on the PC) : pio run -e receiver -t upload
;   Sensor node #1                  : pio run -e node1 -t upload
;   Sensor node #2                  : pio run -e node2 -t upload   (etc.)
;
; Every node MUST have a different NODE_ID. Use the matching nodeN environment.

[platformio]
default_envs = receiver, node1, node2

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/stm32duino/VL53L4CD.git

; ── ESP32-C3 boards (native USB CDC) ──────────────────────────────────────────
[c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ── Receiver ──────────────────────────────────────────────────────────────────
[env:receiver]
extends = c3
build_flags =
    ${c3.build_flags}
    -DROLE_RECEIVER

; Receiver on an ESP32-S3 DevKitC (UART bridge port)
[env:receiver_s3]
board = esp32-s3-devkitc-1
build_flags =
    -DROLE_RECEIVER

; ── Sensor nodes ──────────────────────────────────────────────────────────────
[env:node]
extends = c3
build_flags =
    ${c3.build_flags}
    -DNODE_ID=1

[env:node1]
extends = c3
build_flags =
    ${c3.build_flags}
    -DNODE_ID=1

[env:node2]
extends = c3
build_flags =
    ${c3.build_flags}
    -DNODE_ID=2

[env:node3]
extends = c3
build_flags =
    ${c3.build_flags}
    -DNODE_ID=3

[env:node4]
extends = c3
build_flags =
    ${c3.build_flags}
    -DNODE_ID=4
