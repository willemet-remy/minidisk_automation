[platformio]
default_envs = node

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/stm32duino/VL53L4CD.git
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; One VL53L4CD + one ESP32-S3 per battery-powered measurement node.
[env:node]

; A mains/USB-powered ESP32-S3 which receives and prints all node packets.
[env:receiver]
build_flags =
    ${env.build_flags}
    -DROLE_RECEIVER
